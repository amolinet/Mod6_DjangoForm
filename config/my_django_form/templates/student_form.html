<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Form</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f7f6; }
        .form-container { background: white; padding: 30px; border-radius: 8px; max-width: 600px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin: auto; }
        h2 { border-bottom: 2px solid #eee; padding-bottom: 10px; margin-top: 0; color: #333; }
        button { background-color: #007bff; color: white; border: none; padding: 12px 25px; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 15px; }
        button:hover { background-color: #0056b3; }
        p { margin-bottom: 18px; }
        label { font-weight: bold; display: block; margin-bottom: 6px; }
        /* Clean up Django checkbox list styling */
        ul { list-style-type: none; padding-left: 0; }
        li { margin-bottom: 5px; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Student Information Form</h2>
        
        <form method="POST">
            {% csrf_token %} <!-- Crucial Django security element -->
            
            {{ form.as_p }} <!-- Automatically displays your widgets in <p> tags -->

            <button type="submit">Submit Form</button>
        </form>
    </div>

</body>
</html>
